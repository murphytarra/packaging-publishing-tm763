[project]
name = "cancer-prediction-tm763"
version = "0.1.0"
description = "cancer prediction package library"
authors = [
    {name = "murphytarra",email = "68056855+murphytarra@users.noreply.github.com"}
]
license = {text = "GPL-3.0-or-later"}
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas (>=2.2.3,<3.0.0)",
    "scikit-learn (>=1.6.1,<2.0.0)",
    "matplotlib (>=3.10.1,<4.0.0)",
    "numpy (>=2.2.3,<3.0.0)",
    "streamlit (>=1.43.1,<2.0.0)"
]

[tool.poetry]
packages = [{ include = "cancer-prediction-tm763" }]

[tool.poetry.group.dev.dependencies]
isort = "6.0.1"
flake8 = "^7.1.2"
black = "^25.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
